version: 2
updates:
  # Backend PHP / Symfony (Composer)
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps-backend)"
    groups:
      symfony-packages:
        applies-to: all
        patterns:
          - "symfony/*"
          - "api-platform/*"
          - "lexik/jwt-authentication-bundle"
      testing-dev:
        applies-to: all
        dependency-type: "development"
        patterns:
          - "phpunit/*"
          - "phpstan/*"
          - "friendsofphp/php-cs-fixer"
          - "rector/*"
      security-backend:
        applies-to: security-updates
        patterns:
          - "*"

  # Frontend React / TypeScript (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps-frontend)"
    groups:
      react-ecosystem:
        applies-to: all
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      tanstack:
        applies-to: all
        patterns:
          - "@tanstack/*"
      testing-dev:
        applies-to: all
        dependency-type: "development"
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "typescript"
          - "vite*"
      security-frontend:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps-actions)"
    groups:
      security-actions:
        applies-to: security-updates
        patterns:
          - "*"

  # Docker Base Images
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps-docker)"
    groups:
      security-docker:
        applies-to: security-updates
        patterns:
          - "*"
