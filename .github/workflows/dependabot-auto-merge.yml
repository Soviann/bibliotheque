name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge-or-notify:
    name: Auto-merge or Notify
    runs-on: ubuntu-latest
    steps:
      - name: Extract PR details
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            PR_NUM="${{ github.event.workflow_run.pull_requests[0].number }}"
            CI_STATUS="${{ github.event.workflow_run.conclusion }}"
          else
            PR_NUM="${{ github.event.pull_request.number }}"
            CI_STATUS="pending"
          fi

          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            echo "No associated PR found."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "ci_status=$CI_STATUS" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Fetch Dependabot metadata
        if: steps.pr.outputs.should_run == 'true'
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          pr-number: ${{ steps.pr.outputs.number }}

      - name: Attempt Auto-merge
        if: steps.pr.outputs.should_run == 'true'
        id: merge
        continue-on-error: true
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          UPDATE_TYPE="${{ steps.metadata.outputs.update-type }}"
          CI_STATUS="${{ steps.pr.outputs.ci_status }}"

          # If CI completed with failure, do not merge
          if [ "$CI_STATUS" = "failure" ]; then
            echo "reason=Les tests CI ont échoué." >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # If major update, require manual review
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            echo "reason=Mise à jour majeure ($UPDATE_TYPE) nécessitant une revue manuelle." >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Attempt to merge (squash) directly or set auto-merge
          if gh pr merge "$PR_NUM" --squash --delete-branch || gh pr merge "$PR_NUM" --auto --squash --delete-branch; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "reason=Échec de la commande de fusion (conflit de fusion ou vérifications CI non terminées)." >> "$GITHUB_OUTPUT"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify owner if auto-merge failed or manual review is required
        if: steps.pr.outputs.should_run == 'true' && (steps.merge.outcome != 'success' || steps.pr.outputs.ci_status == 'failure')
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          REASON="${{ steps.merge.outputs.reason }}"
          if [ -z "$REASON" ]; then
            REASON="La fusion automatique n'a pas pu être effectuée."
          fi

          # Assign PR to repository owner
          gh pr edit "$PR_NUM" --add-assignee "Soviann" || true

          # Post notification comment mentioning the owner
          gh pr comment "$PR_NUM" --body "⚠️ **Auto-merge impossible** pour la PR #$PR_NUM.

**Raison** : $REASON

CC @Soviann — Merci de vérifier cette Pull Request."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
